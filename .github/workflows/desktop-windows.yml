name: Windows-Desktop-App
# In der Liste der Läufe sofort sichtbar, ob ein Release entsteht
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.release || startsWith(github.ref, 'refs/tags/desktop-v')) && 'Windows-Desktop-App – mit Release' || 'Windows-Desktop-App – nur Build' }}

# Baut den Playlist Generator als Windows-App (Tauri): NSIS-Installer (.exe) und
# MSI-Pakete (.msi, Deutsch und Englisch). Läuft auf einem Windows-Runner,
# weil WiX (.msi) nur unter Windows baut. Der Web-Build/Deploy ist davon
# unabhängig (eigener Build-Modus, Ausgabe nach dist-desktop/). Anleitung: DESKTOP.md
#
# Auslöser:
#   - manuell (Actions → Windows-Desktop-App → Run workflow): Dateien als Artefakt;
#     mit Haken bei „Als GitHub-Release veröffentlichen“ zusätzlich ein Release
#     desktop-v<Version aus package.json>, Tag auf dem gebauten Commit
#   - Tag desktop-v* (z. B. desktop-v1.0.0): zusätzlich GitHub-Release mit den Dateien
#   - Pull Requests, die die Desktop-Hülle ändern: Probe-Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Als GitHub-Release veröffentlichen (Tag desktop-v<Version aus package.json>)'
        type: boolean
        required: false
        default: false
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-windows.yml'
      - 'vite.config.ts'

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Installer bauen (.exe und .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Baut zuerst das Frontend (npm run build:desktop), dann App und Installer
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-generator-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release anlegen
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Nur package.json, für die Versionsnummer
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: playlist-generator-windows
          path: installer
      # Feste Dateinamen: stabile Links über releases/latest/download/<Name>
      - name: Dateien umbenennen
        run: |
          mkdir dl
          cp installer/nsis/*-setup.exe dl/Playlist-Generator-Setup-x64.exe
          cp installer/msi/*_de-DE.msi dl/Playlist-Generator-x64-de-DE.msi
          cp installer/msi/*_en-US.msi dl/Playlist-Generator-x64-en-US.msi
          ls -la dl
      - name: Release mit Installern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="desktop-v$(node -p "require('./package.json').version")"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release-Tag muss wie desktop-v1.0.1 aussehen, war: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG gibt es schon. Version in package.json erhöhen."
            exit 1
          fi
          echo "Lege Release $RELEASE_TAG an"
          gh release create "$RELEASE_TAG" dl/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Playlist Generator (Windows) $RELEASE_TAG" \
            --notes "Windows-Installer (.exe) und MSI-Pakete (Deutsch, Englisch). Nicht signiert: Windows SmartScreen zeigt beim ersten Start eine Warnung (Weitere Informationen → Trotzdem ausführen)."
